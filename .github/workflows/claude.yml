name: Claude

# Claude turns friends' ideas into merged code. Every issue gets its own run the
# moment it's opened, all in parallel; each run merges its own PR as soon as its
# checks pass locally (rebasing onto whatever landed meanwhile), so nobody waits.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: "Optional extra instruction for this run"
        required: false
      issue:
        description: "Work on this issue number (the sweep starts one run per idea)"
        required: false

run-name: >-
  Claude ${{ github.event.issue.number && format('#{0}', github.event.issue.number) ||
  inputs.issue && format('#{0}', inputs.issue) ||
  github.event.workflow_run && format('fix {0}', github.event.workflow_run.head_branch) ||
  'sweep' }}

# One queue per issue (or per failing branch), so different ideas run side by
# side while follow-up comments on the same issue wait for its current run.
concurrency:
  group: >-
    claude-${{ github.event.issue.number || inputs.issue ||
    (github.event.workflow_run && format('{0}-{1}', github.event.workflow_run.head_branch,
    github.event.workflow_run.conclusion)) || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

# Agents build and test like CI: no debug info, our crates unoptimised.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_OPT_LEVEL: 0

jobs:
  claude:
    # Only trusted authors can make Claude run (the public can still read along).
    # Ideas from Discord are filed through the owner's token, so they count as OWNER.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.label.name == 'claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        (startsWith(github.event.workflow_run.head_branch, 'claude/') ||
          github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A PAT (not GITHUB_TOKEN) so Claude's pushes/PRs trigger CI and auto-merge.
          token: ${{ secrets.BOT_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: claude
      - name: git identity
        run: |
          git config --global user.name "friendslop-bot"
          git config --global user.email "friendslop-bot@users.noreply.github.com"
      # The modeler (every model in the game is made there, see AGENTS.md) as an
      # MCP server: mcp__modeler__* tools, software-rendered agent views, saves
      # in crates/game/.modeler/ and exports in crates/game/assets/.
      - uses: cumsauce/modeler@main
        with:
          project: ${{ github.workspace }}/crates/game
          render: "true"
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          # Reasoning effort for CI runs (low / medium / high).
          CLAUDE_CODE_EFFORT_LEVEL: low
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/chrisgliddon/bevy-skills.git
          plugins: bevy-skills@bevy-skills
          github_token: ${{ secrets.BOT_PAT }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --mcp-config .mcp.json
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Skill,Task,TodoWrite,mcp__modeler__*"
          prompt: |
            You are the sole developer of friendSLOP. Read AGENTS.md first, then .github/claude/run.md, and follow it.

            Trigger for this run:
            - event: ${{ github.event_name }}
            - issue: ${{ github.event.issue.number || inputs.issue }} ${{ github.event.issue.title }}
            - comment by: ${{ github.event.comment.user.login }}
            - failed CI branch: ${{ github.event.workflow_run.head_branch }}
            - extra instruction: ${{ inputs.task }}
            - max parallel runs: ${{ vars.CLAUDE_MAX_PARALLEL || '20' }}
            - repo: ${{ github.repository }}
