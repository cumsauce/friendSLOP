name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **One goal: help everyone with a ! over their head, free the Commune and get into heaven. Quests come from people round the world.**
        Nobody has said who else should give quests, what a quest giver wants in return, or what happens between quests.
        What you bring back (burgers, cigs, soul pieces) still does nothing, and tears, spells and being good have no payoff.
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
