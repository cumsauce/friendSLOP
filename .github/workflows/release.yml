name: Release

# Manual only: Actions tab -> "Release" -> Run workflow (or `gh workflow run release.yml`).
# Publishes a "latest" build so friends can just download and play (desktop only;
# the browser zip is a separate run of web-release.yml, which adds it to "latest").
# `platforms`: all rebuilds "latest" from scratch; a single OS (`-f platforms=mac`)
# builds only that one and replaces just its download in "latest".
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which builds to make
        type: choice
        default: all
        options: [all, mac, linux, windows]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  ALL: >-
    [{"os":"ubuntu-latest","asset":"friendslop-linux-x86_64.tar.gz","only":"linux"},
     {"os":"macos-latest","asset":"friendslop-macos-arm64.tar.gz","only":"mac"},
     {"os":"windows-latest","asset":"friendslop-windows-x86_64.zip","only":"windows"}]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.platforms || 'all' }}
        run: |
          echo "include=$(echo "$ALL" | jq -c --arg w "$WANT" 'map(select($w == "all" or .only == $w))')" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true # ship the real models, sounds and music (#166)
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked
      # The game looks for assets/ next to the executable (#166).
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/friendslop
          cp target/release/friendslop pkg/friendslop/
          cp -R crates/game/assets pkg/friendslop/assets
          tar czf ${{ matrix.asset }} -C pkg friendslop
      - name: package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force pkg/friendslop | Out-Null
          Copy-Item target/release/friendslop.exe pkg/friendslop/
          Copy-Item -Recurse crates/game/assets pkg/friendslop/assets
          Compress-Archive -Path pkg/friendslop -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: friendslop-* # not the github-pages artifact
          merge-multiple: true
      - name: update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANT: ${{ inputs.platforms || 'all' }}
        run: |
          notes="Built from ${{ github.sha }}. Download for your OS, unzip, run. The browser version (friendslop-web.zip) is added by the separate \"Web release\" workflow. Unsigned: on macOS right-click → Open; on Windows click 'More info → Run anyway'."
          if [ "$WANT" != all ] && gh release view latest >/dev/null 2>&1; then
            # One OS: swap just its download, keep the others.
            gh release upload latest dist/* --clobber
            gh release edit latest --notes "$notes (The $WANT build is from ${{ github.sha }}.)"
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/* --title "Latest build" --notes "$notes" \
              --target ${{ github.sha }} --prerelease
          fi
