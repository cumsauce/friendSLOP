[package]
name = "friendslop-base"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "friendSLOP game layer: The shared game layer: players, HUD, people, sound, settings, the shared rules vocabulary and the small features everything else reads."

[lib]
doctest = false

[dependencies]
bevy.workspace = true
bevy_replicon.workspace = true
avian3d.workspace = true
bevy_rerecast.workspace = true
avian_rerecast.workspace = true
bevy_landmass.workspace = true
landmass_rerecast.workspace = true
serde.workspace = true
serde_json = "1"
bevy_voice_chat.workspace = true
fusion = { path = "../fusion" }
friendslop-art = { path = "../art" }
friendslop-core = { path = "../core" }
friendslop-kcc = { path = "../kcc" }
friendslop-wfc = { path = "../wfc" }
friendslop-structures = { path = "../structures" }
friendslop-world = { path = "../world" }
modeler_anim = { git = "https://github.com/cumsauce/modeler", rev = "ba0fd6ad741e26bb65f76e10e52f64b16b6c4bac" }
modeler_bevy = { git = "https://github.com/cumsauce/modeler", rev = "ba0fd6ad741e26bb65f76e10e52f64b16b6c4bac" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Local time zone, for real-world night (whispers, #235). The browser asks JS `Date`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "Window", "Storage", "Navigator", "Clipboard", "ClipboardEvent", "DataTransfer",
  "Document", "Event", "EventTarget", "Location", "UrlSearchParams",
  # Voice chat through Web Audio (voice_web.rs, #166).
  "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioDestinationNode",
  "AudioBuffer", "AudioProcessingEvent", "ScriptProcessorNode", "GainNode", "AudioParam",
  "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
  "MediaStreamAudioSourceNode",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lints]
workspace = true
