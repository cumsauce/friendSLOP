name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **One goal: free the Commune from your landlord and get into heaven, over five chapters that use all the toys.**
        Nobody has said who you are, who Jegg is, what else hides in the warehouse, or what heaven is actually like.
        Every place is on the chapter checklists now, but what you bring back (burgers, cigs, soul pieces, secrets) still does nothing, and tears, spells and being good have no payoff. What other spells could you say out loud, and what should dying mean?
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
