name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **One goal: free the Commune from your landlord and get into heaven, over five chapters that use all the toys.**
        Nobody has said who you are, who Jegg is, or what heaven is actually like.
        Most things still have no payoff of their own: what do tears, totem spells, burgers or being good get you, and what if the villagers catch you or the helicopter shoots you?
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
