[package]
name = "friendslop-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "friendSLOP on Android (#354): the game as an APK. Empty on other platforms."

# cargo-apk loads the game as a native library (NativeActivity).
[lib]
crate-type = ["cdylib"]
doctest = false
test = false

# A plain dependency: Bevy's derives look for `bevy` here. The activity
# feature only does anything when building for Android.
[dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy_replicon.workspace = true
avian3d.workspace = true
friendslop = { path = "../game" }
friendslop-data = { path = "../data" }

# `scripts/build-android.sh` (cargo-apk) reads this.
[package.metadata.android]
package = "net.friendslop.game"
apk_name = "friendslop"
assets = "../game/assets"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "friendSLOP"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode|density"

# Vulkan 1.1 (wgpu's Android backend).
[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.gamepad"
required = false

# iroh P2P and voice chat.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

[lints]
workspace = true
