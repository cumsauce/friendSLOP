name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # CI never runs a debugger: no debug info (faster links, smaller cache), and
  # our own crates unoptimised (deps stay at opt-level 3 via package."*").
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_OPT_LEVEL: 0

jobs:
  # Lint and test run side by side on their own runners.
  lint:
    name: lint (linux)
    # Claude's PRs are checked in its own session and merged without waiting;
    # main still runs CI after they land (and a failure starts a fix run).
    if: ${{ !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (linux)
    # Claude's PRs are checked in its own session and merged without waiting;
    # main still runs CI after they land (and a failure starts a fix run).
    if: ${{ !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --workspace --locked

  # The browser build (#106) must keep compiling. Linux only, no wasm-bindgen.
  web:
    name: web (wasm32 check)
    # Claude's PRs are checked in its own session and merged without waiting;
    # main still runs CI after they land (and a failure starts a fix run).
    if: ${{ !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # iroh's TLS (ring) compiles C for wasm32: needs clang + llvm-ar.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - name: clippy (wasm32)
        run: cargo clippy -p friendslop --target wasm32-unknown-unknown --locked

  # Single required check for branch protection / auto-merge.
  ci-ok:
    if: always()
    needs: [lint, test, web]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.web.result }}"; do
            [[ "$r" == success || "$r" == skipped ]]
          done
