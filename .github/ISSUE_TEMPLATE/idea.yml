name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **Lots of small toys, one goal: beat the landlord. Crows, a bear, a goat, pets, totems, duels, farts, gods tears, organ money, morality, weird stats.**
        Nobody has said what you are outside a duel, or where all this is.
        Most things have no payoff yet: what do organs, morality, tears, totems and connected pets actually get you?
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
