name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **Almost nothing exists: a blank 3D world (in cat colours) with crows, one bear, a voice-changing mushroom, a judgmental goat, talking music boxes, duels, voice chat, a cute menu, organs as money, a morality score, transforming gods tears, a regular 20-second freeze, and tunable farting.**
        Nobody has said what you are outside a duel, or what you're all trying to achieve together.
        Nobody has said how you get organs or what you spend them on, or what being good or wicked (or an Abduction) does.
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
