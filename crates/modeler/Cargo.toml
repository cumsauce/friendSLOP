[package]
name = "friendslop-modeler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MCP-driven mesh modeling tool: primitives, CSG booleans, UVs, glTF export. No game code"

[dependencies]
bevy = { workspace = true, features = ["picking"] }
serde.workspace = true
serde_json = "1"
csgrs = "0.3"
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
png = "0.18"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
gltf = "1"

[lints]
workspace = true
