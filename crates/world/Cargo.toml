[package]
name = "friendslop-world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The map: terrain heights, paths, pond and lake, the village buildings, landmarks and procedural surfaces. No game code: features register what they place."

[dependencies]
bevy.workspace = true
avian3d.workspace = true
friendslop-core = { path = "../core" }
friendslop-art = { path = "../art" }
friendslop-structures = { path = "../structures" }
# Reads the .bsn maps the modeler exports (the parser only, not the jackdaw runtime).
jackdaw_bsn = "0.20.2"
# Reads the plain `<map>.map.json` the modeler writes beside each scene.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
