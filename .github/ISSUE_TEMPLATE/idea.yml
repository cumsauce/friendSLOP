name: Game idea
description: Tell Claude something the game should have. Anything goes.
labels: [idea]
body:
  - type: markdown
    attributes:
      # CLAUDE-HINTS-START (Claude rewrites this block from GAME_DESIGN.md)
      value: |
        **Almost nothing exists: a blank 3D world with crows, one bear, a voice-changing mushroom, voice chat, and organs as money.**
        Nobody has said what you are, what you do, or what you're all trying to achieve together.
        Nobody has said how you get organs or what you spend them on.
      # CLAUDE-HINTS-END
  - type: textarea
    id: details
    attributes:
      label: Tell us more
      description: As much or as little as you like. Claude will fill in the gaps creatively.
    validations:
      required: true
