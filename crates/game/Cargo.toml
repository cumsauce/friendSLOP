[package]
name = "friendslop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
bevy_replicon.workspace = true
avian3d.workspace = true
bevy_rerecast.workspace = true
avian_rerecast.workspace = true
bevy_landmass.workspace = true
landmass_rerecast.workspace = true
serde.workspace = true

# Native only: the iroh transport (a tokio runtime plus `block_on` every tick),
# voice chat (cpal capture/playback threads) and the clipboard can't run on a
# browser's main thread. The web build (scripts/build-web.sh) leaves them out;
# see "Web build" in GAME_DESIGN.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_replicon_iroh.workspace = true
bevy_voice_chat.workspace = true
tokio.workspace = true
arboard.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Navigator", "Clipboard"] }
# getrandom 0.3 also needs `--cfg getrandom_backend="wasm_js"` (.cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
# Browser multiplayer (#106): iroh over its relays (no UDP in a browser), driven
# with wasm-bindgen-futures instead of tokio. Same version bevy_replicon_iroh uses.
iroh = { version = "~1.3", default-features = false, features = ["tls-ring"] }
wasm-bindgen-futures = "0.4"
async-channel = "2"
bytes = "1"
# Same protocol as desktop peers: voice messages must be registered identically
# (replicon hashes type names). No `opus`: browsers only send IMA-ADPCM.
bevy_voice_chat = { version = "0.3", default-features = false, features = ["replicon"] }

[lints]
workspace = true
