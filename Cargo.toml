[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# bevy_voice_chat 0.3 pins bevy subcrates to =0.20.0 and replicon to =0.45.2, so keep these exact.
bevy = { version = "=0.20.0", features = ["wav"] }
bevy_replicon = "=0.45.2"
bevy_replicon_iroh = "0.20"
bevy_voice_chat = { version = "0.3", features = ["replicon", "opus"] }
avian3d = "0.8"
bevy_rerecast = "0.6"
avian_rerecast = "0.7"
bevy_landmass = "0.13"
landmass_rerecast = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
arboard = "3"

[workspace.lints.clippy]
unwrap_used = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1
# Line numbers in backtraces but no full debug info: full info made target/
# grow past 40 GB and every link slower. Set `debug = true` locally to step
# through code in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# Proc macros (Bevy's derives, `bsn!`) and build scripts optimised too: the
# macros run on every rebuild of the game crate, and run faster optimised.
[profile.dev.build-override]
opt-level = 3

# The soundtrack synthesizes live on the audio thread; it's small, so
# optimise it fully even in dev builds.
[profile.dev.package.fusion]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored patch of rerecast 0.5.0 (see vendor/rerecast/README-friendSLOP.md):
# skip a contour that fails to triangulate, like C++ recast does, instead of
# aborting the whole navmesh bake with "Invalid contour" — without it no
# settings build a mesh over our 200x200 m map (upstream #59/#64, fix proposed
# in upstream PR #60 but unmerged).
[patch.crates-io]
rerecast = { path = "vendor/rerecast" }

# The browser build (scripts/build-web.sh, #191). Phones download and compile
# the whole .wasm before the first frame, so it's built for size: optimise
# for size, whole-program LTO, one codegen unit. The soundtrack synth and the
# physics stay at full speed (they run every frame).
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.web.package.fusion]
opt-level = 3

[profile.web.package.avian3d]
opt-level = 3
