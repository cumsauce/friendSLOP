[package]
name = "friendslop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false

# main.rs has no tests of its own.
[[bin]]
name = "friendslop"
path = "src/main.rs"
test = false

[features]
# Faster rebuilds on desktop: Bevy as a shared library, so a small change
# relinks in seconds (`cargo dev host`, see .cargo/config.toml). Never for
# release, CI or the web build.
dev = ["bevy/dynamic_linking"]

[dependencies]
miniz_oxide = "0.8"
bevy.workspace = true
bevy_replicon.workspace = true
avian3d.workspace = true
bevy_rerecast.workspace = true
avian_rerecast.workspace = true
bevy_landmass.workspace = true
landmass_rerecast.workspace = true
serde.workspace = true
# Reads the modeler's glTF node extras (LOD distances, lod.rs).
serde_json = "1"
# Voice chat on every peer. The browser swaps cpal for Web Audio (voice_web.rs,
# #166); the replicon protocol it registers (VoiceUp/VoiceDown) must be
# identical to the desktop's or browser and desktop peers can't talk.
bevy_voice_chat.workspace = true
# The generated soundtrack (composer + synths), Bevy-free (crates/fusion).
fusion = { path = "../fusion" }
# The foundation crates (see "Crates" in AGENTS.md): no game code in them.
friendslop-art = { path = "../art" }
friendslop-core = { path = "../core" }
friendslop-kcc = { path = "../kcc" }
friendslop-wire = { path = "../wire" }
friendslop-wfc = { path = "../wfc" }
friendslop-structures = { path = "../structures" }
friendslop-world = { path = "../world" }
friendslop-data = { path = "../data" }
# The game layer (see "Crates" in AGENTS.md): shared infra and the features.
friendslop-base = { path = "../base" }
friendslop-play = { path = "../play" }
friendslop-places = { path = "../places" }
friendslop-village = { path = "../village" }
friendslop-story = { path = "../story" }
friendslop-afterlife = { path = "../afterlife" }
friendslop-side = { path = "../side" }
friendslop-side-nyc = { path = "../side-nyc" }
# The modeler's runtime: live wind sway for rigged trees (`extras.sway`), each
# instance with its own phase (lod.rs, scenery.rs).
# The modeler's wind and spring maths (tree tempo in lod.rs, creature springs
# in rigged.rs); the same revision modeler_bevy uses.
modeler_anim = { git = "https://github.com/cumsauce/modeler", rev = "ba0fd6ad741e26bb65f76e10e52f64b16b6c4bac" }
modeler_bevy = { git = "https://github.com/cumsauce/modeler", rev = "ba0fd6ad741e26bb65f76e10e52f64b16b6c4bac" }

# Native only: the iroh transport (a tokio runtime plus `block_on` every tick),
# and the clipboard can't run on a
# browser's main thread. The web build (scripts/build-web.sh) leaves them out;
# see "Web build" in GAME_DESIGN.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_replicon_iroh.workspace = true
tokio.workspace = true
arboard.workspace = true
# Local time zone, for real-world night (whispers, #235). The browser asks JS `Date`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "Window", "Storage", "Navigator", "Clipboard", "ClipboardEvent", "DataTransfer",
  "Document", "Event", "EventTarget", "Location", "UrlSearchParams",
  # Voice chat through Web Audio (voice_web.rs, #166).
  "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioDestinationNode",
  "AudioBuffer", "AudioProcessingEvent", "ScriptProcessorNode", "GainNode", "AudioParam",
  "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
  "MediaStreamAudioSourceNode",
] }
wasm-bindgen = "0.2"
# getrandom 0.3 also needs `--cfg getrandom_backend="wasm_js"` (.cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
# Browser transport (net_web.rs): iroh runs relay-only in the browser and
# speaks bevy_replicon_iroh's wire protocol to desktop peers.
iroh = "1.3"
n0-future = "0.3"
wasm-bindgen-futures = "0.4"
async-channel = "2"
bytes = "1"

[lints]
workspace = true
